name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    name: Bump Version and Tag Release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bump script
        run: python scripts/bump_version.py ${{ inputs.bump_type }}

      - name: Run tests against new version
        run: pytest

      - name: Push commit and tag
        run: |
          NEW=$(cat VERSION | tr -d '[:space:]')
          git push origin HEAD
          git push origin "v$NEW"

      - name: Summary
        run: |
          NEW=$(cat VERSION | tr -d '[:space:]')
          echo "### ✅ Version Bumped to \`$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag \`v$NEW\` pushed — release workflow will trigger automatically." >> "$GITHUB_STEP_SUMMARY"
